<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Merge Bakery</title><style>
/* Standalone authored game artwork; independent of Studio interface themes. */
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101725;touch-action:none}body{display:grid;place-items:center;height:100dvh}canvas{display:block;width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw);touch-action:none;user-select:none;-webkit-user-select:none}
</style></head><body><canvas width="450" height="800" aria-label="Merge Bakery"></canvas><script>
'use strict';
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const W=450,H=800,zh=navigator.language.toLowerCase().startsWith('zh');
const tr=(a,b)=>zh?a:b;
document.documentElement.lang=zh?'zh-CN':'en';
let phase='ready',score=0,elapsed=0,last=0,muted=false,audio=null,shake=0,particles=[],floats=[],pointer=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function box(x,y,w,h,color,r=12){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function text(s,x,y,size=20,color='#fff',align='center'){fitText(s,x,y,size,color,align==='left'?W-x-18:Math.min(414,2*Math.min(x-8,W-x-8)),align);}
function line(x,y,a,b,color,width=3){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke();}

// Authored canvas detail is independent game content, not generated image assets.
let artTime=0,impactRings=[];
function fitText(s,x,y,size,color,maxWidth,align='center'){
 ctx.font=`700 ${size}px system-ui,sans-serif`;
 while(ctx.measureText(s).width>maxWidth&&size>10){size-=.5;ctx.font=`700 ${size}px system-ui,sans-serif`;}
 ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function gradient(x,y,w,h,top,bottom,r=12){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,top);g.addColorStop(1,bottom);box(x,y,w,h,g,r);}
function confetti(x,y){for(let i=0;i<60;i++)particles.push({x,y,vx:rand(-210,210),vy:rand(-290,-90),life:rand(.7,1.3),color:['#ffcb57','#ff708c','#83e9da','#fff6ce'][i%4]});}
function guide(x1,y1,x2,y2,label){
 if((phase!=='ready'&&!(phase==='playing'&&elapsed<3))||pointer!==null)return;
 const t=(artTime%2)/2, eased=t*t*(3-2*t),x=x1+(x2-x1)*eased,y=y1+(y2-y1)*eased;
 ctx.save();ctx.globalAlpha=.75;line(x1,y1,x2,y2,'#fff5c9',3);circle(x1,y1,8,'#fff5c9');ctx.globalAlpha=1;
 // A vector hand silhouette stays consistent across emoji/font installations.
 ctx.translate(x,y);ctx.rotate(-.25);ctx.shadowColor='#201524';ctx.shadowBlur=5;
 box(-8,-4,27,30,'#fff8e4',9);box(-8,-26,10,33,'#fff8e4',5);box(0,-9,10,22,'#fff8e4',5);box(8,-5,10,20,'#fff8e4',5);line(-7,20,-19,7,'#fff8e4',11);ctx.restore();
 const by=755;box(16,729,418,53,'#17263b',14);fitText(label,225,by,16,'#fff3c5',390);
}

function tone(f=440){if(muted||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.6,audio.currentTime+.13);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.17);}
function unlock(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)try{audio=new A()}catch{}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}
function burst(x,y,color='#ffdc78',label=''){for(let i=0;i<28;i++)particles.push({x,y,vx:rand(-170,170),vy:rand(-230,70),life:.8,color});impactRings.push({x,y,life:.24});if(label)floats.push({x,y,s:label,life:1});shake=8;tone(660);}
function finish(won){if(phase!=='playing')return;phase=won?'won':'lost';pointer=null;tone(won?880:160);}
function start(){if(phase==='ready')phase='playing';}
function restart(){phase='ready';score=0;elapsed=0;pointer=null;particles=[];floats=[];impactRings=[];artTime=0;shake=0;init();}
function pill(label,x,y,w=100){box(x-w/2,y-17,w,34,'#28354c',12);text(label,x,y,16);}
function header(title,sub){fitText(title,22,36,24,'#fff',350,'left');fitText(sub,22,70,14,'#b6c6df',406,'left');box(388,15,48,43,'#28354c');text(muted?'♪×':'♪',412,37,23);}
function hint(s){box(16,729,418,53,'#28354c');fitText(s,225,755,16,'#ffdf8a',390);}
function frame(ts){const dt=last?Math.min((ts-last)/1000,.04):0;last=ts;artTime+=dt;if(phase==='playing'){elapsed+=dt;update(dt);}ctx.clearRect(0,0,W,H);ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake=Math.max(0,shake-dt*30);}draw();for(const r of impactRings){r.life-=dt;ctx.save();ctx.globalAlpha=Math.max(0,r.life/.24);circle(r.x,r.y,12+(1-r.life/.24)*32,'#fff8e4');ctx.restore();}impactRings=impactRings.filter(r=>r.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;circle(p.x,p.y,Math.max(0,p.life)*5,p.color);}particles=particles.filter(p=>p.life>0);for(const p of floats){p.life-=dt;p.y-=dt*48;ctx.save();ctx.shadowColor='#211b32';ctx.shadowBlur=5;text(p.s,clamp(p.x,90,360),p.y,26+(1-p.life)*4,'#ffdf8a');ctx.restore();}floats=floats.filter(p=>p.life>0);ctx.restore();guide(80,410,177,410,tr('拖动相同点心合成','Drag matching pastries to merge'));if(phase==='won'||phase==='lost'){box(25,248,400,290,'#111c30',24);text(phase==='won'?tr('挑战成功！','YOU DID IT!'):tr('再试一次！','TRY AGAIN!'),225,299,31,'#ffdf8a');text(result(),225,353,19);text(tr('得分 ','SCORE ')+score,225,397,23);box(95,447,260,62,'#ffd077',18);text(tr('再来一局 ↻','PLAY AGAIN ↻'),225,478,24,'#322435');}requestAnimationFrame(frame);}
function pos(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(pointer!==null)return;unlock();const p=pos(e);if(p.x>=388&&p.y<=64){muted=!muted;return;}if(phase==='won'||phase==='lost'){if(p.x>=95&&p.x<=355&&p.y>=447&&p.y<=509)restart();return;}pointer=e.pointerId;canvas.setPointerCapture?.(e.pointerId);start();down(p);});
canvas.addEventListener('pointermove',e=>{if(pointer===e.pointerId&&phase==='playing')move(pos(e));});
function release(e,cancel=false){if(pointer!==e.pointerId)return;pointer=null;if(phase==='playing'){if(cancel)cancelInput();else up(pos(e));}}
canvas.addEventListener('pointerup',e=>release(e));canvas.addEventListener('pointercancel',e=>release(e,true));
window.addEventListener('blur',()=>{pointer=null;cancelInput();last=0;});
document.addEventListener('visibilitychange',()=>{pointer=null;cancelInput();last=0;});
window.__omGame={state:()=>({phase,score,elapsed,...details()}),start,restart};

let board,customers,coins=0,drag=null,ovenCooldown=0,served=0;
const goods=['●','◒','▰','✿','♛'],names=()=>zh?['面团','小餐包','可颂','奶油蛋糕','皇冠蛋糕']:['Dough','Bun','Croissant','Cake','Crown'];
const colors=['#fce3ad','#edac64','#d97b47','#ed8d9a','#c4a2ee'];
const cellPos=i=>({x:80+(i%4)*97,y:410+Math.floor(i/4)*91});
function cellAt(p){for(let i=0;i<12;i++){const c=cellPos(i);if(Math.abs(c.x-p.x)<43&&Math.abs(c.y-p.y)<43)return i;}return -1;}
function order(){return{want:1+Math.floor(Math.random()*4),wait:28};}
function init(){board=Array(12).fill(-1);board[0]=0;board[1]=0;board[2]=1;customers=[order(),order(),order()];customers[0].want=1;coins=0;served=0;drag=null;ovenCooldown=0;}
function down(p){if(p.y>650&&p.y<721){if(ovenCooldown>0)return;const empty=board.indexOf(-1);if(empty>=0){board[empty]=0;ovenCooldown=.18;tone(290);burst(cellPos(empty).x,cellPos(empty).y,'#fce3ad');}else burst(225,675,'#ed8d9a',tr('合成腾出位置','MERGE TO MAKE ROOM'));return;}const i=cellAt(p);if(i>=0&&board[i]>=0)drag={i,x:p.x,y:p.y};}
function move(p){if(drag){drag.x=p.x;drag.y=p.y;}}
function up(p){if(!drag)return;const i=drag.i,v=board[i];drag=null;
 if(p.y>170&&p.y<325){const c=Math.floor((p.x-24)/134);if(c>=0&&c<3){if(customers[c].want===v){const earned=[0,15,35,75,150][v];board[i]=-1;coins+=earned;score=coins;served++;customers[c]=order();burst(90+c*134,250,'#ffe08a',`+$${earned}`);if(coins>=250)finish(true);}else burst(90+c*134,250,'#ed8d9a',tr('订单不符','WRONG ORDER'));}return;}
 const j=cellAt(p);if(j<0||j===i)return;if(board[j]===v&&v<4){board[j]=v+1;board[i]=-1;const c=cellPos(j);burst(c.x,c.y,colors[v+1],names()[v+1]);}else if(board[j]===-1){board[j]=v;board[i]=-1;tone(350);} }
function cancelInput(){drag=null;}
function update(dt){ovenCooldown=Math.max(0,ovenCooldown-dt);customers.forEach((c,i)=>{c.wait-=dt;if(c.wait<=0){customers[i]=order();tone(170);}});if(elapsed>=90)finish(coins>=250);}
function pastry(v,x,y,size=30){ctx.save();ctx.translate(x,y);ctx.scale(size/30,size/30);ctx.shadowColor='#623323';ctx.shadowBlur=5;ctx.shadowOffsetY=4;
 if(v===0){gradient(-27,-21,54,43,'#fff1cb','#dba46d',20);circle(-10,-11,5,'#fff8df');for(let i=0;i<7;i++)circle(-15+i*5,9+Math.sin(i)*3,1,'#b98454');}
 if(v===1){gradient(-29,-23,58,47,'#f8cd78','#b95c26',19);for(let i=0;i<3;i++)line(-16+i*12,-10,-7+i*12,2,'#ffe5a1',4);}
 if(v===2){for(let i=0;i<7;i++){const t=(i-3)/3;ctx.save();ctx.translate(t*25,Math.abs(t)*15-5);ctx.rotate(t*.65);gradient(-9,-17,18,32-Math.abs(t)*12,'#ffd88b','#b85b24',7);line(-5,-10,4,-10,'#ffe5a7',2);ctx.restore();}}
 if(v>=3){gradient(-27,-5,54,28,'#b4673d','#6e392b',5);box(-27,2,54,6,'#fbe4bd',1);gradient(-29,-16,58,22,'#fff8ea','#f3b5b8',8);for(let i=0;i<5;i++)circle(-22+i*11,-8,6,'#fff2de');for(let i=0;i<3;i++){circle(-17+i*17,-21,5,'#d94d55');circle(-18+i*17,-23,2,'#ffb0a4');}if(v===4){gradient(-18,-34,36,17,'#ffe99c','#d7a038',3);for(let i=0;i<3;i++)circle(-15+i*15,-35,5,'#ffe9a6');circle(0,-29,3,'#e66578');}}
 ctx.restore();}

function draw(){gradient(0,0,450,800,'#9b5945','#4c2a29',0);for(let i=0;i<9;i++){box(i*56,135,28,198,i%2?'#eab69a':'#f6d8b5',0);}gradient(18,340,414,306,'#c68b55','#88512e',12);for(let y=368;y<647;y+=28){line(24,y,426,y,'#a66a3d',2);for(let x=37;x<420;x+=71)line(x,y+8,x+35,y+11,'#d6a16d',1);}header(tr('合成小烘焙','MERGE BAKERY'),tr('烤面团 → 合成 → 拖给顾客','Bake → merge → serve customers'));pill(`$${coins} / 250`,100,110,160);pill(`${Math.ceil(90-elapsed)}s`,340,110);
 box(14,153,422,180,'#ffe3ce',18);for(let i=0;i<3;i++){const x=90+i*134,c=customers[i];box(x-51,165,102,73,'#fff8eb');pastry(c.want,x,194,23);text(names()[c.want],x,226,12,'#6b4355');circle(x,273,23,['#b9b9dc','#b3cfae','#eab7bc'][i]);circle(x-7,272,2,'#553c55');circle(x+7,272,2,'#553c55');text(c.wait<9?'⌢':'⌣',x,284,18,'#553c55');circle(x-13,280,4,'#e9938d');circle(x+13,280,4,'#e9938d');box(x-22,250,44,9,['#604734','#8b573d','#674a4d'][i],5);box(x-43,310,86,7,'#d8b6aa',3);box(x-43,310,86*clamp(c.wait/28,0,1),7,'#c57d86',3);}
 text(tr('相同点心拖到一起升级','Drag matching pastries together'),225,350,16,'#fff5df');for(let i=0;i<12;i++){const p=cellPos(i);box(p.x-43,p.y-37,86,78,'#76472f',12);gradient(p.x-40,p.y-35,80,72,'#e0b886','#c68f5d',10);if(board[i]>=0&&drag?.i!==i)pastry(board[i],p.x,p.y,29);}
 box(65,653,320,65,'#db9469',18);box(82,664,55,40,'#593f51',8);text('♨',109,683,30,'#ffd37d');text(tr('点击烤炉 · 出面团','TAP OVEN · BAKE'),260,681,18,'#412c40');if(drag)pastry(board[drag.i],drag.x,drag.y,33);
 hint(phase==='ready'?tr('☝ 点烤炉，拖两个面团合成餐包','☝ Tap oven, drag two doughs to merge'):tr('顾客等候28秒 · 90秒赚满 $250','Orders wait 28s · earn $250 in 90s'));
}
function result(){return tr('营业额 $','REVENUE $')+coins+tr(' · 完成订单 ',' · ORDERS ')+served;}
function details(){return{board:[...board],customers:customers.map(c=>({...c})),coins,target:250,served,timeLeft:Math.max(0,90-elapsed)};}

restart();requestAnimationFrame(frame);
</script></body></html>
