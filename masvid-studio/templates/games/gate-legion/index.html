        catch { }
} if (audio?.state === 'suspended')

    particles.splice(0, particles.length - 220); }
function pop(text, x = 180, y = 330, color = '#fff0a8') { labels.push({ text, x, y, color, t: 1 }); tone(); }
function hit() { shake = reduced ? 0 : 10; flash = reduced ? 0 : .16; tone(130); }
function end(win, text) { phase = win ? 'won' : 'lost'; result = text; activePointer = null; tone(win ? 780 : 140); }
function start() { if (phase === 'ready')
    phase = 'playing'; }
function restart() { phase = 'ready'; elapsed = 0; score = 0; particles = []; labels = []; shake = 0; flash = 0; result = ''; activePointer = null; px = 180; py = 520; init(); }
function rect(x, y, w, h, color) { c.fillStyle = color; c.fillRect(x, y, w, h); }

function text(s, x, y, size = 18, color = '#f8f5e7', align = 'center') { c.save(); c.fillStyle = color; c.font = `800 ${size}px system-ui,sans-serif`; c.textAlign = align; c.lineJoin = 'round'; c.strokeStyle = '#132131'; c.lineWidth = Math.max(2, size * .14); c.strokeText(s, x, y); c.fillText(s, x, y); c.restore(); }

function pointer(e) { let r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (activePointer !== null)
    return; wake(); const p = pointer(e); if (p.x > 302 && p.y < 58) {

    return;
} if (phase === 'won' || phase === 'lost') {

} activePointer = e.pointerId; canvas.setPointerCapture(e.pointerId); px = p.x; py = p.y; start(); input(p, true); });

function frame(ms) {

    c.save();

        shake = Math.max(0, shake - dt * 28);

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 200 * dt;
        if (p.t <= 0) {

            continue;
        }
        circle(p.x, p.y, 2, p.color);
    }
    for (let i = labels.length - 1; i >= 0; i--) {
        let p = labels[i];
        p.t -= dt;
        p.y -= dt * 50;
        text(p.text, p.x, p.y, 23 + Math.sin(Math.min(1, (1 - p.t) * 4) * Math.PI) * 8, p.color);
        if (p.t <= 0)
            labels.splice(i, 1);
    }
    c.restore();
    if (flash > 0) {
        c.save();
        c.globalAlpha = Math.min(.38, flash * 2);

        c.restore();
        flash = Math.max(0, flash - dt);
    }
    panel(10, 10, 340, 48, '#101b2d');
    sprite(12, 8, 7, 344, 55);
    panel(24, 64, 312, 29, '#17283d');
    text(T(META.zh, META.title), 22, 39, 16, '#ffffff', 'left');
    text(muted ? T('静音', 'OFF') : T('声音', 'SND'), 325, 39, 12);
    text(hud(), 180, 84, 16);
    tutorial(ms);
    if (phase === 'ready') {
        panel(14, 565, 332, 58);
        text(T('触摸即可开始', 'Touch to begin'), 180, 604, 14, '#8fe6bd');
    }
    if (phase === 'won' || phase === 'lost') {
        rect(0, 100, 360, 540, '#06101fe8');
        text(phase === 'won' ? T('挑战成功', 'SUCCESS') : T('挑战结束', 'RUN OVER'), 180, 270, 30);
        text(result, 180, 320, 16);
        text(T('得分 ', 'SCORE ') + score, 180, 354, 22, '#ffe299');
        panel(65, 386, 230, 60, '#23745b');
        text(T('再来一局 ↻', 'PLAY AGAIN ↻'), 180, 423, 21);
    }
    requestAnimationFrame(frame);
}
let army, runnerX, gates, battle, battleClock, enemies, originalArmy, targetEnemy, maxArmy, battleCarry;
const pairs = [['+10', '−5'], ['×2', '÷2'], ['−8', '+18'], ['÷3', '×2'], ['+22', '−15'], ['×2', '÷2'], ['−20', '+16'], ['÷2', '×2']];
function init() { army = 12; runnerX = 180; battle = false; battleClock = 0; maxArmy = pairs.reduce((n, p) => Math.max(...p.map(op => apply(op, n))), 12); targetEnemy = Math.floor(maxArmy * .72); enemies = targetEnemy; originalArmy = 0; battleCarry = 0; gates = pairs.map((p, i) => ({ y: -i * 410 - 160, ops: i % 2 ? [...p].reverse() : p, done: false })); }

function snapshot() { return { army, enemies, targetEnemy, maxArmy, gatesPassed: gates.filter(g => g.done).length, battle }; }
function hud() { return T('军团 ', 'ARMY ') + army + '   ·   ' + gates.filter(g => g.done).length + '/8'; }
function apply(op, n) { let a = Number(op.slice(1)); return Math.max(0, Math.min(999, op[0] === '+' ? n + a : op[0] === '−' ? n - a : op[0] === '×' ? n * a : Math.floor(n / a))); }
function update(dt) { if (!battle) {

}

    battleClock += dt;
    battleCarry += Math.max(originalArmy, targetEnemy) / 3 * dt;
    const loss = Math.min(army, enemies, Math.floor(battleCarry));
    battleCarry -= loss;
    if (loss) {
        army -= loss;
        enemies -= loss;
        burst(180, 380, '#ffd58b', 3);
    }
