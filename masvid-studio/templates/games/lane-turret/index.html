    text(muted ? T('静音', 'OFF') : T('声音', 'SND'), 325, 39, 12);
    text(hud(), 180, 84, 16);
    tutorial(ms);
    if (phase === 'ready') {

        text(phase === 'won' ? T('挑战成功', 'SUCCESS') : T('挑战结束', 'RUN OVER'), 180, 270, 30);
        text(result, 180, 320, 16);
        text(T('得分 ', 'SCORE ') + score, 180, 354, 22, '#ffe299');

let explosions = [], turret, enemies, bullets, cards, choices, wave, waveTime, spawned, fire, health, power, rate, spread, kills, upgrades;
function init() { explosions = []; turret = 180; enemies = []; bullets = []; cards = []; choices = false; wave = 1; waveTime = 0; spawned = 0; fire = 0; health = 7; power = 1; rate = .23; spread = 1; kills = 0; upgrades = 0; }

        if (i === 1)
