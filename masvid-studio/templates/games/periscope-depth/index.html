<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121a"><link rel="icon" href="data:,"><title>Periscope Depth</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04090d;color:#cfe9e2;font-family:ui-monospace,"SF Mono",Menlo,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #7ff2c8;outline-offset:4px}
.bar{position:fixed;z-index:3;inset:18px 22px auto;display:flex;justify-content:space-between;gap:12px;pointer-events:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.bar>div{display:flex;gap:18px}.bar b{color:#7ff2c8;font-weight:600}.tool{pointer-events:auto;border:1px solid #7ff2c855;background:#06121acc;padding:8px 13px;border-radius:4px}
.noise{position:fixed;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);width:min(60vw,420px);pointer-events:none;font-size:11px;letter-spacing:.2em;text-align:center}.noise .tr{height:6px;background:#7ff2c822;margin-top:6px}.noise .fl{height:100%;background:#7ff2c8;width:0}
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#04090de6}.overlay[hidden]{display:none}
.card{max-width:540px}.eyebrow{font-size:12px;letter-spacing:.3em;color:#7ff2c8}h1{font:700 clamp(44px,7vw,84px)/1 system-ui,sans-serif;letter-spacing:-.03em;margin:16px 0;color:#e6fff6}p{font:16px/1.75 system-ui,sans-serif;color:#9cb9b1}
.primary{background:#7ff2c8;color:#04201a;border:0;padding:15px 28px;border-radius:4px;font-size:13px;letter-spacing:.2em;margin:6px;font-weight:700}.primary:hover{background:#c8ffe9}.hint{font-size:12px;color:#6f8d86;margin-top:18px;line-height:1.9}
.toast{position:fixed;top:18%;left:50%;transform:translate(-50%,-50%);z-index:4;font:700 22px system-ui;letter-spacing:.24em;color:#ffcf6a;opacity:0;transition:opacity .15s;pointer-events:none}.toast.show{opacity:1}
.pads{position:fixed;z-index:3;bottom:60px;left:0;right:0;display:none;justify-content:center;gap:10px}.pads button{width:78px;height:56px;border:1px solid #7ff2c866;background:#06121ad0;border-radius:8px;font-size:13px}
@media(pointer:coarse){.pads{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div class="bar"><div><span id="lScore">Score</span> <b id="score">0</b><span id="lTorp">Torpedoes</span> <b id="torps">6</b><span id="lHull">Hull</span> <b id="hull">3</b></div><button class="tool" id="pauseBtn">Pause</button></div>
<div class="noise" id="noiseBox"><span id="noiseLabel">Detection</span><div class="tr"><div class="fl" id="noise"></div></div></div>
<div class="toast" id="toast"></div>
<div class="pads"><button id="pL">◀</button><button id="pF">FIRE</button><button id="pR">▶</button><button id="pD">DIVE</button></div>
<section class="overlay" id="intro"><div class="card"><div class="eyebrow" id="eye">SILENT PATROL · ONE HTML FILE</div><h1 id="title">Periscope Depth</h1><p id="desc"></p><button class="primary" id="start">Raise periscope</button><div class="hint" id="hint"></div></div></section>
<section class="overlay" id="pause" hidden><div class="card"><h1 id="pTitle">Holding depth</h1><button class="primary" id="resume">Resume</button><button class="primary" id="restart">Restart</button></div></section>
<section class="overlay" id="end" hidden><div class="card"><div class="eyebrow" id="endEye"></div><h1 id="endTitle"></h1><p id="endText"></p><button class="primary" id="again">New patrol</button></div></section>
<script>
(()=>{
const zh=/^zh/i.test(navigator.language||'');
const L=zh?{score:'得分',torp:'鱼雷',hull:'船体',noise:'被发现',eye:'静默巡航 · 单文件小游戏',title:'潜望深渊',desc:'升起潜望镜，在海平线上找到航母和货船。提前量瞄准，鱼雷要飞一会儿才到。开火会暴露位置——被驱逐舰发现后立刻下潜，在声呐图里躲开深水炸弹。',start:'升起潜望镜',hint:'← → / A D 转动潜望镜 · 空格 / 点击 发射 · S / ↓ 下潜 · P / Esc 暂停 · R 重开',pause:'暂停',ptitle:'保持深度',resume:'继续',restart:'重开',again:'再次出航',hit:'命中',sunk:'击沉',miss:'未命中',detected:'被驱逐舰发现 — 下潜！',dive:'下潜中',escaped:'甩掉了',surface:'回到潜望深度',winEye:'巡航结束',win:'凯旋',lose:'被击沉',endText:(s,k)=>`击沉 ${k} 艘，得分 ${s}。`,out:'鱼雷打光了',fire:'发射',diveBtn:'下潜'}:{score:'Score',torp:'Torpedoes',hull:'Hull',noise:'Detection',eye:'SILENT PATROL · ONE HTML FILE',title:'Periscope Depth',desc:"Raise the periscope and find the carrier and freighters on the horizon. Lead your shot — torpedoes take a while to arrive. Every launch makes noise: once a destroyer locks on, dive and dodge depth charges on sonar.",start:'Raise periscope',hint:'← → / A D turn the periscope · Space / click fire · S / ↓ dive · P / Esc pause · R restart',pause:'Pause',ptitle:'Holding depth',resume:'Resume',restart:'Restart',again:'New patrol',hit:'HIT',sunk:'SUNK',miss:'MISS',detected:'DESTROYER CONTACT — DIVE!',dive:'DIVING',escaped:'CONTACT LOST',surface:'BACK AT PERISCOPE DEPTH',winEye:'PATROL COMPLETE',win:'Back to port',lose:'Lost at sea',endText:(s,k)=>`${k} ships sunk, score ${s}.`,out:'Out of torpedoes',fire:'FIRE',diveBtn:'DIVE'};
lScore.textContent=L.score;lTorp.textContent=L.torp;lHull.textContent=L.hull;noiseLabel.textContent=L.noise;eye.textContent=L.eye;title.textContent=L.title;desc.textContent=L.desc;start.textContent=L.start;hint.textContent=L.hint;pauseBtn.textContent=L.pause;pTitle.textContent=L.ptitle;resume.textContent=L.resume;restart.textContent=L.restart;again.textContent=L.again;pF.textContent=L.fire;pD.textContent=L.diveBtn;if(zh)document.documentElement.lang='zh-CN';
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D;function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D}addEventListener('resize',size);size();
let round=0,state='intro',mode='scope',t=0,last=0,ac,keys={};let yaw,ships,torps,booms,score,kills,ammo,hull,noise,sub,charges,diveT,spawnT,shake,flash;
const FOV=60;// degrees visible
function reset(){round++;yaw=0;ships=[];torps=[];booms=[];score=0;kills=0;ammo=6;hull=3;noise=0;charges=[];mode='scope';spawnT=0;shake=0;flash=0;for(let i=0;i<3;i++)spawn(i===0?'carrier':'freighter');hud()}
function spawn(k){const dir=Math.random()<.5?1:-1;ships.push({k,az:(Math.random()*160-80),dist:k==='destroyer'?.35+Math.random()*.2:.55+Math.random()*.4,speed:(k==='destroyer'?7:k==='carrier'?2.4:3.2)*dir,hp:k==='carrier'?2:1,sink:0,len:k==='carrier'?1.6:k==='destroyer'?.9:1.1})}
function hud(){score_.textContent=score;torps_.textContent=ammo;hull_.textContent=Math.max(0,hull);noise_.style.width=Math.min(100,noise)+'%'}
const score_=document.getElementById('score'),torps_=document.getElementById('torps'),hull_=document.getElementById('hull'),noise_=document.getElementById('noise');
function beep(f,d,v=.06,type='sine',slide){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toast(s,ms=900){toast_.textContent=s;toast_.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast_.classList.remove('show'),ms)}const toast_=document.getElementById('toast');
function fire(){if(state!=='play')return;if(mode!=='scope')return;if(ammo<=0){toast(L.out);return}ammo--;torps.push({az:yaw,d:0});noise+=34;beep(180,.6,.08,'triangle',60);hud();if(noise>=100)detect()}
function detect(){if(mode!=='scope')return;toast(L.detected,1400);beep(1200,.15,.06,'square');setTimeout(()=>beep(1200,.15,.06,'square'),250);if(!ships.some(s=>s.k==='destroyer'&&!s.sink))spawn('destroyer');mode='alert';diveT=2.2}
function dive(){if(state!=='play'||mode==='sonar')return;mode='sonar';sub={x:.5,y:.62,vx:0,vy:0};charges=[];diveT=11;spawnT=0;toast(L.dive);beep(90,1,.08,'sawtooth',50)}
function step(dt){
  const turn=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0)+(padTurn||0);
  shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt*2);
  if(mode==='scope'||mode==='alert'){yaw=Math.max(-90,Math.min(90,yaw+turn*42*dt));noise=Math.max(0,noise-dt*(mode==='alert'?0:3));
    if(mode==='alert'){diveT-=dt;if(diveT<=0){hull--;shake=14;flash=1;beep(60,.8,.15,'sawtooth');hud();if(hull<=0)return finish(false);dive()}}}
  ships.forEach(s=>{if(s.sink){s.sink+=dt;return}s.az+=s.speed*dt;if(Math.abs(s.az)>100){s.speed*=-1}});
  ships=ships.filter(s=>s.sink<4);
  torps.forEach(tp=>{tp.d+=dt*.18;ships.forEach(s=>{if(s.sink||tp.hit)return;if(tp.d>=s.dist&&tp.d-dt*.18<s.dist){const half=s.len*9/(s.dist+.3);if(Math.abs(tp.az-s.az)<half){tp.hit=true;s.hp--;booms.push({az:s.az,dist:s.dist,l:1.2});shake=8;beep(70,1.1,.16,'sawtooth',30);
    if(s.hp<=0){s.sink=.01;kills++;score+=s.k==='carrier'?500:s.k==='destroyer'?300:200;toast(L.sunk);{const r=round;setTimeout(()=>{if(r===round&&state!=='end')spawn(Math.random()<.3?'carrier':'freighter')},2500)}}else{score+=100;toast(L.hit)}hud()}}})});
  torps=torps.filter(tp=>{if(tp.hit)return false;if(tp.d>1.05){toast(L.miss,500);return false}return true});
  booms.forEach(b=>b.l-=dt);booms=booms.filter(b=>b.l>0);
  if(mode==='sonar'){const ax=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0)+(padTurn||0),ay=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
    sub.vx+=(ax*.28-sub.vx)*Math.min(1,dt*2.5);sub.vy+=(ay*.18-sub.vy)*Math.min(1,dt*2.5);sub.x=Math.max(.06,Math.min(.94,sub.x+sub.vx*dt));sub.y=Math.max(.3,Math.min(.92,sub.y+sub.vy*dt));
    spawnT-=dt;if(spawnT<=0&&diveT>1.5){spawnT=.55+Math.random()*.5;charges.push({x:Math.max(.05,Math.min(.95,sub.x+(Math.random()-.5)*.35)),y:.18,det:sub.y+(Math.random()-.5)*.12,ex:0});beep(400,.08,.03)}
    charges.forEach(ch=>{if(ch.ex){ch.ex+=dt;return}ch.y+=dt*.22;if(ch.y>=ch.det){ch.ex=.01;shake=6;beep(55,.7,.14,'sawtooth',30);const dd=Math.hypot((ch.x-sub.x)*W/H,ch.y-sub.y);if(dd<.07){hull--;flash=1;shake=16;hud();if(hull<=0)finish(false)}}});
    charges=charges.filter(ch=>ch.ex<.8);
    diveT-=dt;if(diveT<=0){mode='scope';noise=30;ships=ships.filter(s=>s.k!=='destroyer'||s.sink);toast(L.escaped+' · '+L.surface,1300);hud()}}
  if(state==='play'&&ammo<=0&&torps.length===0&&mode==='scope')finish(true);
  hud()}
function finish(win){if(state!=='play')return;state='end';end.hidden=false;endEye.textContent=win?L.winEye:L.lose.toUpperCase();endTitle.textContent=win?L.win:L.lose;endText.textContent=L.endText(score,kills)}
// ---------- render ----------
function drawScope(){const cx=W/2,cy=H/2,R=Math.min(W,H)*.44;
  x.fillStyle='#04090d';x.fillRect(0,0,W,H);x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
  const hz=cy+Math.sin(t*.8)*4;
  let g=x.createLinearGradient(0,cy-R,0,hz);g.addColorStop(0,'#2b4a5c');g.addColorStop(1,'#b8c7b9');x.fillStyle=g;x.fillRect(cx-R,cy-R,2*R,hz-cy+R);
  g=x.createLinearGradient(0,hz,0,cy+R);g.addColorStop(0,'#3d6670');g.addColorStop(1,'#0b2730');x.fillStyle=g;x.fillRect(cx-R,hz,2*R,cy+R-hz);
  x.strokeStyle='#cfe9e233';for(let i=0;i<14;i++){const yy=hz+Math.pow(i/14,1.8)*(cy+R-hz);x.beginPath();for(let xx=cx-R;xx<cx+R;xx+=16)x.lineTo(xx,yy+Math.sin(xx*.03+t*2+i)*(1+i*.3));x.stroke()}
  const pxPerDeg=2*R/FOV;
  [...ships].sort((a,b)=>b.dist-a.dist).forEach(s=>{const sx=cx+(s.az-yaw)*pxPerDeg;const sc=1/(s.dist+.3);const yy=hz+ (1-s.dist)*R*.12;if(Math.abs(sx-cx)>R+200)return;drawShip(s,sx,yy+s.sink*14*sc,sc*R/170)});
  booms.forEach(b=>{const sx=cx+(b.az-yaw)*pxPerDeg,yy=hz+(1-b.dist)*R*.12;x.fillStyle=`rgba(255,180,90,${b.l*.7})`;x.beginPath();x.arc(sx,yy-20*(1.2-b.l),30*(1.4-b.l)+10,0,7);x.fill();x.fillStyle=`rgba(200,220,215,${b.l*.5})`;x.fillRect(sx-6,yy-90*(1.2-b.l),12,90*(1.2-b.l))});
  torps.forEach(tp=>{const sx=cx+(tp.az-yaw)*pxPerDeg;const yy=cy+R*.9-tp.d*(cy+R*.9-hz);x.strokeStyle='#e6fff6aa';x.lineWidth=2;x.beginPath();x.moveTo(sx,yy);x.lineTo(sx,yy+18+tp.d*10);x.stroke()});
  // reticle
  x.strokeStyle='#04090dcc';x.lineWidth=1.5;x.beginPath();x.moveTo(cx-R,cy);x.lineTo(cx+R,cy);x.moveTo(cx,cy-R);x.lineTo(cx,cy+R);x.stroke();
  for(let d=-30;d<=30;d+=5){const tx=cx+d*pxPerDeg;x.beginPath();x.moveTo(tx,cy-(d%10?6:12));x.lineTo(tx,cy+(d%10?6:12));x.stroke()}
  x.restore();
  // housing
  x.strokeStyle='#111c22';x.lineWidth=Math.max(18,R*.08);x.beginPath();x.arc(cx,cy,R+x.lineWidth/2-2,0,7);x.stroke();
  x.fillStyle='#7ff2c8';x.font='12px ui-monospace,monospace';x.textAlign='center';x.fillText(`BRG ${(yaw<0?360+yaw:yaw).toFixed(0).padStart(3,'0')}°`,cx,cy+R+34);
  // bearing tape of contacts
  ships.filter(s=>!s.sink).forEach(s=>{const tx=cx+Math.max(-1,Math.min(1,(s.az-yaw)/90))*R;x.fillStyle=s.k==='destroyer'?'#ff7a6a':s.k==='carrier'?'#ffcf6a':'#7ff2c8';x.fillRect(tx-3,cy-R-30,6,10)});
  x.textAlign='left';
  if(mode==='alert'){x.fillStyle=`rgba(255,60,50,${.15+.15*Math.sin(t*12)})`;x.fillRect(0,0,W,H)}}
function drawShip(s,sx,yy,k){x.save();x.translate(sx,yy);x.scale(k*(s.speed<0?-1:1),k);x.rotate(s.sink*.08);x.fillStyle=s.k==='destroyer'?'#2a3438':'#3a4448';
  const L=s.len*120;x.beginPath();x.moveTo(-L/2,0);x.lineTo(L/2+18,-2);x.lineTo(L/2,12);x.lineTo(-L/2+6,12);x.closePath();x.fill();
  if(s.k==='carrier'){x.fillRect(-L/2,-8,L,8);x.fillRect(L*.12,-26,18,18);x.fillRect(L*.16,-34,6,8)}
  else if(s.k==='destroyer'){x.fillRect(-20,-14,40,14);x.fillRect(-6,-28,8,14);x.fillRect(L*.3,-6,14,6);x.fillRect(-L*.35,-6,14,6)}
  else{for(let i=0;i<4;i++){x.fillStyle=['#7b4b3a','#4f6a7a','#8a7a4a','#5a6b52'][i];x.fillRect(-L/2+12+i*22,-14,20,14)}x.fillStyle='#3a4448';x.fillRect(L/2-30,-22,20,22)}
  x.restore()}
function drawSonar(){x.fillStyle='#021015';x.fillRect(0,0,W,H);x.strokeStyle='#7ff2c81a';for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
  x.fillStyle='#7ff2c822';x.fillRect(0,0,W,H*.16);x.fillStyle='#7ff2c8';x.font='12px ui-monospace,monospace';x.fillText((zh?'声呐 · 剩余 ':'SONAR · ')+Math.max(0,diveT).toFixed(1)+'s',20,H-24);
  // destroyer on surface
  const dx=W*(.5+Math.sin(t*.7)*.3);x.fillStyle='#ff7a6a';x.fillRect(dx-40,H*.16-10,80,10);x.fillRect(dx-8,H*.16-22,14,12);
  // ping rings
  const pr=(t*.6)%1;x.strokeStyle=`rgba(127,242,200,${1-pr})`;x.beginPath();x.arc(sub.x*W,sub.y*H,pr*Math.max(W,H)*.5,0,7);x.stroke();
  charges.forEach(ch=>{if(ch.ex){x.fillStyle=`rgba(255,207,106,${.8-ch.ex})`;x.beginPath();x.arc(ch.x*W,ch.y*H,ch.ex*120+10,0,7);x.fill()}else{x.fillStyle='#ffcf6a';x.fillRect(ch.x*W-5,ch.y*H-7,10,14);x.strokeStyle='#ffcf6a44';x.setLineDash([4,6]);x.beginPath();x.moveTo(ch.x*W,ch.y*H);x.lineTo(ch.x*W,ch.det*H);x.stroke();x.setLineDash([]);x.strokeStyle='#ffcf6a66';x.beginPath();x.arc(ch.x*W,ch.det*H,.07*H,0,7);x.stroke()}});
  x.save();x.translate(sub.x*W,sub.y*H);x.scale(sub.vx<0?-1:1,1);x.fillStyle='#7ff2c8';x.beginPath();x.ellipse(0,0,46,12,0,0,7);x.fill();x.fillRect(-8,-22,18,12);x.fillRect(-56,-2,10,4);x.restore()}
let padTurn=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;if(state==='play')step(dt);x.setTransform(D,0,0,D,0,0);if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);if(mode==='sonar'&&state!=='intro')drawSonar();else drawScope();if(flash){x.fillStyle=`rgba(255,80,60,${flash*.4})`;x.fillRect(-20,-20,W+40,H+40)}noiseBox.style.visibility=mode==='sonar'?'hidden':'visible';requestAnimationFrame(loop)}
function go(){reset();state='play';intro.hidden=pause.hidden=end.hidden=true;beep(300,.3,.05,'sine',600)}
function pauseT(){if(state==='play'){state='paused';pause.hidden=false}else if(state==='paused'){state='play';pause.hidden=true}}
start.onclick=go;again.onclick=go;restart.onclick=go;resume.onclick=pauseT;pauseBtn.onclick=pauseT;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '){e.preventDefault();if(state==='intro'||state==='end')return go();return fire()}if(k==='enter'&&(state==='intro'||state==='end'))return go();if(k==='p'||k==='escape')return pauseT();if(k==='r'&&state!=='intro')return go();if((k==='s'||k==='arrowdown')&&mode!=='sonar')dive();keys[k]=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
c.addEventListener('pointerdown',()=>{if(!matchMedia('(pointer:coarse)').matches)fire()});
pL.onpointerdown=()=>padTurn=-1;pR.onpointerdown=()=>padTurn=1;pL.onpointerup=pR.onpointerup=pL.onpointerleave=pR.onpointerleave=()=>padTurn=0;pF.onpointerdown=e=>{e.preventDefault();fire()};pD.onpointerdown=e=>{e.preventDefault();dive()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseT()});
reset();requestAnimationFrame(loop);
})();
</script></body></html>
