<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Castle Crush</title><style>
/* Standalone authored game artwork; independent of Studio interface themes. */
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101725;touch-action:none}body{display:grid;place-items:center;height:100dvh}canvas{display:block;width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw);touch-action:none;user-select:none;-webkit-user-select:none}
</style></head><body><canvas width="450" height="800" aria-label="Castle Crush"></canvas><script>
'use strict';
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const W=450,H=800,zh=navigator.language.toLowerCase().startsWith('zh');
const tr=(a,b)=>zh?a:b;
document.documentElement.lang=zh?'zh-CN':'en';
let phase='ready',score=0,elapsed=0,last=0,muted=false,audio=null,shake=0,particles=[],floats=[],pointer=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function box(x,y,w,h,color,r=12){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function text(s,x,y,size=20,color='#fff',align='center'){fitText(s,x,y,size,color,align==='left'?W-x-18:Math.min(414,2*Math.min(x-8,W-x-8)),align);}
function line(x,y,a,b,color,width=3){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke();}

// Authored canvas detail is independent game content, not generated image assets.
let artTime=0,impactRings=[];
function fitText(s,x,y,size,color,maxWidth,align='center'){
 ctx.font=`700 ${size}px system-ui,sans-serif`;
 while(ctx.measureText(s).width>maxWidth&&size>10){size-=.5;ctx.font=`700 ${size}px system-ui,sans-serif`;}
 ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function gradient(x,y,w,h,top,bottom,r=12){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,top);g.addColorStop(1,bottom);box(x,y,w,h,g,r);}
function confetti(x,y){for(let i=0;i<60;i++)particles.push({x,y,vx:rand(-210,210),vy:rand(-290,-90),life:rand(.7,1.3),color:['#ffcb57','#ff708c','#83e9da','#fff6ce'][i%4]});}
function guide(x1,y1,x2,y2,label){
 if((phase!=='ready'&&!(phase==='playing'&&elapsed<3))||pointer!==null)return;
 const t=(artTime%2)/2, eased=t*t*(3-2*t),x=x1+(x2-x1)*eased,y=y1+(y2-y1)*eased;
 ctx.save();ctx.globalAlpha=.75;line(x1,y1,x2,y2,'#fff5c9',3);circle(x1,y1,8,'#fff5c9');ctx.globalAlpha=1;
 // A vector hand silhouette stays consistent across emoji/font installations.
 ctx.translate(x,y);ctx.rotate(-.25);ctx.shadowColor='#201524';ctx.shadowBlur=5;
 box(-8,-4,27,30,'#fff8e4',9);box(-8,-26,10,33,'#fff8e4',5);box(0,-9,10,22,'#fff8e4',5);box(8,-5,10,20,'#fff8e4',5);line(-7,20,-19,7,'#fff8e4',11);ctx.restore();
 const by=755;box(16,729,418,53,'#17263b',14);fitText(label,225,by,16,'#fff3c5',390);
}

function tone(f=440){if(muted||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.6,audio.currentTime+.13);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.17);}
function unlock(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)try{audio=new A()}catch{}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}
function burst(x,y,color='#ffdc78',label=''){for(let i=0;i<28;i++)particles.push({x,y,vx:rand(-170,170),vy:rand(-230,70),life:.8,color});impactRings.push({x,y,life:.24});if(label)floats.push({x,y,s:label,life:1});shake=8;tone(660);}
function finish(won){if(phase!=='playing')return;phase=won?'won':'lost';pointer=null;tone(won?880:160);}
function start(){if(phase==='ready')phase='playing';}
function restart(){phase='ready';score=0;elapsed=0;pointer=null;particles=[];floats=[];impactRings=[];artTime=0;shake=0;init();}
function pill(label,x,y,w=100){box(x-w/2,y-17,w,34,'#28354c',12);text(label,x,y,16);}
function header(title,sub){fitText(title,22,36,24,'#fff',350,'left');fitText(sub,22,70,14,'#b6c6df',406,'left');box(388,15,48,43,'#28354c');text(muted?'♪×':'♪',412,37,23);}
function hint(s){box(16,729,418,53,'#28354c');fitText(s,225,755,16,'#ffdf8a',390);}
function frame(ts){const dt=last?Math.min((ts-last)/1000,.04):0;last=ts;artTime+=dt;if(phase==='playing'){elapsed+=dt;update(dt);}ctx.clearRect(0,0,W,H);ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake=Math.max(0,shake-dt*30);}draw();for(const r of impactRings){r.life-=dt;ctx.save();ctx.globalAlpha=Math.max(0,r.life/.24);circle(r.x,r.y,12+(1-r.life/.24)*32,'#fff8e4');ctx.restore();}impactRings=impactRings.filter(r=>r.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;circle(p.x,p.y,Math.max(0,p.life)*5,p.color);}particles=particles.filter(p=>p.life>0);for(const p of floats){p.life-=dt;p.y-=dt*48;ctx.save();ctx.shadowColor='#211b32';ctx.shadowBlur=5;text(p.s,clamp(p.x,90,360),p.y,26+(1-p.life)*4,'#ffdf8a');ctx.restore();}floats=floats.filter(p=>p.life>0);ctx.restore();guide(72,525,27,582,tr('向后拖动，松手发射','Pull back, release to launch'));if(phase==='won'||phase==='lost'){box(25,248,400,290,'#111c30',24);text(phase==='won'?tr('挑战成功！','YOU DID IT!'):tr('再试一次！','TRY AGAIN!'),225,299,31,'#ffdf8a');text(result(),225,353,19);text(tr('得分 ','SCORE ')+score,225,397,23);box(95,447,260,62,'#ffd077',18);text(tr('再来一局 ↻','PLAY AGAIN ↻'),225,478,24,'#322435');}requestAnimationFrame(frame);}
function pos(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(pointer!==null)return;unlock();const p=pos(e);if(p.x>=388&&p.y<=64){muted=!muted;return;}if(phase==='won'||phase==='lost'){if(p.x>=95&&p.x<=355&&p.y>=447&&p.y<=509)restart();return;}pointer=e.pointerId;canvas.setPointerCapture?.(e.pointerId);start();down(p);});
canvas.addEventListener('pointermove',e=>{if(pointer===e.pointerId&&phase==='playing')move(pos(e));});
function release(e,cancel=false){if(pointer!==e.pointerId)return;pointer=null;if(phase==='playing'){if(cancel)cancelInput();else up(pos(e));}}
canvas.addEventListener('pointerup',e=>release(e));canvas.addEventListener('pointercancel',e=>release(e,true));
window.addEventListener('blur',()=>{pointer=null;cancelInput();last=0;});
document.addEventListener('visibilitychange',()=>{pointer=null;cancelInput();last=0;});
window.__omGame={state:()=>({phase,score,elapsed,...details()}),start,restart};

let level=0,shots=3,bodies,stone=null,aim=null,settle=0,transition=0,destroyed=0,debris=[],trail=[];
const sling={x:72,y:525},ground=684;
// Wood is fragile, stone transfers impacts; defenders are separate physical bodies.
function build(){bodies=[];debris=[];trail=[];const add=(x,y,w,h,type)=>bodies.push({x,y,w,h,type,vx:0,vy:0,angle:0,hp:type==='wood'?1:type==='stone'?3:1,hit:false,flash:0});
 const x=282+(level%2)*6,tiers=level<2?2:3;
 for(let t=0;t<tiers;t++){const base=684-t*92,span=t===2?58:76;
 add(x,base-32,24,64,t===0&&level>1?'stone':'wood');add(x+span,base-32,24,64,'wood');
 add(x+span/2,base-74,span+36,20,t===1&&level>0?'stone':'wood');
 if(t===tiers-1||t===0)add(x+span/2,base-103,26,38,'guard');}
 if(level===1){add(405,652,24,64,'stone');add(401,603,27,33,'guard');}
 if(level===3){add(405,636,23,96,'wood');add(398,578,48,20,'wood');add(400,548,26,38,'guard');}
 stone=null;aim=null;shots=3;settle=0;transition=0;}

function init(){level=0;destroyed=0;build();}
function down(p){if(stone||transition||shots<=0)return;if(Math.hypot(p.x-sling.x,p.y-sling.y)<90)aim={x:sling.x,y:sling.y};}
function move(p){if(aim){const dx=p.x-sling.x,dy=p.y-sling.y,len=Math.hypot(dx,dy),s=Math.min(1,85/(len||1));aim={x:sling.x+dx*s,y:sling.y+dy*s};}}
function up(p){if(!aim)return;move(p);let vx=(sling.x-aim.x)*7,vy=(sling.y-aim.y)*7;if(Math.hypot(vx,vy)<65){aim=null;return;}stone={x:sling.x,y:sling.y,vx,vy,r:13,age:0,hit:new Set()};shots--;aim=null;settle=0;tone(200);}
function cancelInput(){aim=null;}
function damage(b,impulse){if(b.hp<=0)return;b.vx+=impulse.x;b.vy+=impulse.y;b.hit=true;b.flash=.18;b.hp--;if(b.hp<=0){score+=b.type==='guard'?150:25;if(b.type==='guard')destroyed++;debris.push({...b,vx:impulse.x*.7+rand(-50,50),vy:-180,life:1.1,angle:0});burst(b.x,b.y,b.type==='guard'?'#f5ac9c':'#e0bb8d',b.type==='guard'?'+150':'+25');}}
function physics(dt){for(const b of bodies){if(b.hp<=0)continue;b.vy+=650*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.exp(-dt*.7);if(b.y+b.h/2>=ground){b.y=ground-b.h/2;if(b.vy>145&&b.type==='guard'){damage(b,{x:0,y:0});continue;}b.vy=0;b.vx*=Math.exp(-dt*4);}if(b.x-b.w/2>450||b.x+b.w/2<0){damage(b,{x:0,y:0});continue;}}
 // AABB dynamic supports: upper bodies settle on lower bodies, never on deleted blocks.
 for(let pass=0;pass<3;pass++)for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];if(a.hp<=0||b.hp<=0)continue;const ox=(a.w+b.w)/2-Math.abs(a.x-b.x),oy=(a.h+b.h)/2-Math.abs(a.y-b.y);if(ox<=0||oy<=0)continue;if(oy<=ox){const top=a.y<b.y?a:b,bottom=top===a?b:a;const impact=Math.abs(top.vy-bottom.vy);top.y=bottom.y-bottom.h/2-top.h/2;top.vy=Math.min(top.vy,bottom.vy);if(impact>150){damage(top,{x:bottom.vx*.3,y:-30});damage(bottom,{x:top.vx*.25,y:0});}}else{const sign=Math.sign(a.x-b.x)||1;a.x+=sign*ox/2;b.x-=sign*ox/2;const impact=Math.abs(a.vx-b.vx);if(impact>90){damage(a,{x:-sign*50,y:-40});damage(b,{x:sign*90,y:-40});}else{a.vx*=.8;b.vx*=.8;}}}
 if(stone){const s=stone;s.age+=dt;s.vy+=650*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;for(const b of bodies){if(b.hp<=0||s.hit.has(b))continue;const nx=clamp(s.x,b.x-b.w/2,b.x+b.w/2),ny=clamp(s.y,b.y-b.h/2,b.y+b.h/2);if(Math.hypot(s.x-nx,s.y-ny)<s.r){s.hit.add(b);damage(b,{x:s.vx*.42,y:Math.min(-45,s.vy*.25)});s.vx*=.74;s.vy*=.7;}}if(s.y>ground-13){s.y=ground-13;s.vy*=-.27;s.vx*=.75;}if(s.age>3.4||s.x>520||s.x< -80){stone=null;settle=.9;}}
}
function update(dt){for(const b of bodies)b.flash=Math.max(0,b.flash-dt);for(const d of debris){d.life-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=500*dt;d.angle+=dt*5;}debris=debris.filter(d=>d.life>0);trail.forEach(t=>t.life-=dt);trail=trail.filter(t=>t.life>0);if(stone)trail.push({x:stone.x,y:stone.y,life:.3});for(let i=0;i<4;i++)physics(dt/4);if(transition>0){transition-=dt;if(transition<=0){level++;build();}return;}if(bodies.filter(b=>b.type==='guard'&&b.hp>0).length===0){if(level===3)finish(true);else transition=.9;return;}if(!stone){settle=Math.max(0,settle-dt);if(shots===0&&settle===0)finish(false);}if(elapsed>=90)finish(false);}
function drawBody(b){if(b.type==='guard'){gradient(b.x-b.w/2,b.y-b.h/2,b.w,b.h,'#d8845e','#8e4c4d',7);circle(b.x,b.y-8,12,'#f8d4a3');gradient(b.x-16,b.y-23,32,17,'#d3e6e2','#72939d',5);box(b.x-3,b.y-28,6,13,'#bf6957',2);circle(b.x-4,b.y-7,2,'#453552');circle(b.x+4,b.y-7,2,'#453552');box(b.x-12,b.y+3,24,9,'#a3b9b7',3);circle(b.x-8,b.y+10,7,'#c6d2c6');}
 else {const x=b.x-b.w/2,y=b.y-b.h/2;box(x+3,y+4,b.w,b.h,'#4a5145',3);gradient(x,y,b.w,b.h,b.type==='wood'?'#e7bd7f':'#cad1bd',b.type==='wood'?'#a66e3f':'#84998e',3);
 if(b.type==='wood'){for(let i=5;i<b.w;i+=9)line(x+i,y+4,x+i+Math.sin(i)*3,y+b.h-4,'#ac7747',1);for(const dx of [4,b.w-4])for(const dy of [4,b.h-4])circle(x+dx,y+dy,1.7,'#735941');}else{line(x+3,y+3,x+b.w-3,y+3,'#ecedcf',2);for(let i=9;i<b.w;i+=19)line(x+i,y+7,x+i+4,y+11,'#9fae9d',1);if(b.hp<3){line(b.x-6,b.y-6,b.x+7,b.y+6,'#596b75',2);line(b.x+1,b.y,b.x+8,b.y-6,'#596b75',2);}}}}
function draw(){gradient(0,0,450,800,'#56829a','#f4d8ae',0);header(tr('弹弓攻城','CASTLE CRUSH'),tr('向后下方拉弓，松手击碎城塔','Pull back & down, release to crush'));pill(`${level+1} / 4`,80,109);pill(tr('石块 ','SHOTS ')+shots,231,109,126);pill(`${Math.ceil(90-elapsed)}s`,370,109);
 circle(350,218,54,'#ffe5af');for(let layer=0;layer<2;layer++){ctx.fillStyle=layer?'#7b9c8c':'#9bb2a1';ctx.beginPath();ctx.moveTo(0,684);for(let i=0;i<=9;i++)ctx.lineTo(i*60-30,345+layer*75+Math.sin(i*2+layer)*65);ctx.lineTo(450,684);ctx.closePath();ctx.fill();}
 for(let i=0;i<5;i++){const x=35+i*94,y=397+(i%2)*32;gradient(x,y,60,253,'#b9b6a0','#738f87',3);for(let k=0;k<3;k++)box(x+k*23-3,y-12,17,20,'#b9b6a0',2);box(x+22,y+32,15,34,'#54716d',7);line(x+30,y-12,x+30,y-62,'#826e51',3);ctx.fillStyle=i%2?'#cb6d57':'#e4b75e';ctx.beginPath();ctx.moveTo(x+31,y-62);ctx.lineTo(x+60,y-53);ctx.lineTo(x+31,y-42);ctx.fill();}
 gradient(0,683,450,117,'#84925e','#454e3c',0);box(0,684,450,13,'#dfcd94',0);for(let i=0;i<40;i++){const x=i*37%450,y=705+i*19%90;line(x,y,x+10,y-3,'#9fa775',2);}

 line(72,675,72,526,'#bc865f',17);line(72,558,48,507,'#d7a777',12);line(72,558,96,507,'#d7a777',12);const a=aim||sling;line(48,507,a.x,a.y,'#603e48',6);line(96,507,a.x,a.y,'#603e48',6);
 if(aim){for(let t=.12;t<1.5;t+=.12){const vx=(sling.x-aim.x)*7,vy=(sling.y-aim.y)*7;const x=sling.x+vx*t,y=sling.y+vy*t+325*t*t;if(y<680&&x<445)circle(x,y,3,'#ffe8ac');}circle(aim.x,aim.y,13,'#e6dbc5');}else if(!stone&&shots>0)circle(sling.x,sling.y,13,'#e6dbc5');
 for(const t of trail){ctx.save();ctx.globalAlpha=t.life/.3*.6;circle(t.x,t.y,13*t.life/.3,'#fff2ca');ctx.restore();}
 for(const b of bodies){if(b.hp<=0)continue;drawBody(b);if(b.flash>0){ctx.save();ctx.globalAlpha=b.flash/.18*.85;box(b.x-b.w/2,b.y-b.h/2,b.w,b.h,'#fff9dc',4);ctx.restore();}}
 for(const d of debris){ctx.save();ctx.globalAlpha=Math.min(1,d.life*2);ctx.translate(d.x,d.y);ctx.rotate(d.angle);drawBody({...d,x:0,y:0});if(d.type==='guard'){text('× ×',0,-8,14,'#493b42');}ctx.restore();}

 if(stone){circle(stone.x+3,stone.y+3,13,'#333952');circle(stone.x,stone.y,13,'#e6dbc5');circle(stone.x-3,stone.y-4,4,'#fff1d7');}
 hint(phase==='ready'?tr('☝ 从弹弓处向左下拖动，再松手','☝ Drag down-left from sling, then release'):tr('打掉全部守卫 · 每关只有3发','Clear every guard · only 3 stones per stage'));
}
function result(){return tr('通过 ','CLEARED ')+(phase==='won'?4:level)+tr(' / 4关 · 守卫 ',' / 4 · GUARDS ')+destroyed;}
function details(){return{level:level+1,shots,guardsRemaining:bodies.filter(b=>b.type==='guard'&&b.hp>0).length,destroyed,stone:stone?{x:stone.x,y:stone.y,vx:stone.vx,vy:stone.vy}:null,bodies:bodies.filter(b=>b.hp>0).map(b=>({...b})),timeLeft:Math.max(0,90-elapsed)};}

restart();requestAnimationFrame(frame);
</script></body></html>
