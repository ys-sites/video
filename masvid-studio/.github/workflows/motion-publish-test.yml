name: Motion package and release
run-name: Motion ${{ inputs.archive_only && 'recovery' || inputs.mode }} · ${{ inputs.channel || 'test' }} · ${{ inputs.version || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prepublish builds and validates a candidate. Publish uploads after validation.'
        type: choice
        options: [prepublish, publish]
        default: prepublish
      channel:
        description: 'test uses DEV templates; stable uses prod templates'
        type: choice
        options: [test, stable]
        default: test
      version:
        description: 'Exact version. Required for stable or an existing candidate; blank names a new test candidate.'
        type: string
        required: false
      candidate_run_id:
        description: 'Optional existing candidate run ID. Enter its exact version to reuse the original package.'
        type: string
        required: false
      source_sha:
        description: 'Optional source commit already integrated into main when building a new candidate.'
        type: string
        required: false
  workflow_call:
    inputs:
      mode:
        type: string
      source_sha:
        type: string
      channel:
        type: string
        default: test
      version:
        type: string
        required: true
      archive_only:
        type: boolean
        required: true
      candidate_run_id:
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ !inputs.archive_only && inputs.mode == 'prepublish' && format('motion-prepublish-{0}', github.run_id) || 'motion-test-publication' }}
  cancel-in-progress: false

env:
  MOTION_RELEASE_CHANNEL: ${{ inputs.channel || 'test' }}
  MOTION_VERSION: ${{ inputs.version }}
  MOTION_RELEASE_ACTION: ${{ inputs.archive_only && 'archive-only' || inputs.mode != 'publish' && 'prepublish' || inputs.channel == 'stable' && 'publish-stable' || 'publish-test' }}

jobs:
  candidate:
    if: ${{ github.repository == 'nexu-io/openmotion' && !inputs.archive_only && !inputs.candidate_run_id }}
    uses: ./.github/workflows/motion-candidate.yml
    with:
      channel: ${{ inputs.channel || 'test' }}
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}

  verify:
    needs: candidate
    if: ${{ always() && !cancelled() && github.repository == 'nexu-io/openmotion' && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped' && (inputs.archive_only || inputs.candidate_run_id)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTION_VERSION: ${{ needs.candidate.outputs.version || inputs.version }}
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      tgz_sha256: ${{ steps.download.outputs.tgz_sha256 }}
      version: ${{ needs.candidate.outputs.version || inputs.version }}
    steps:
      - name: Require Motion integration branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Select main in Run workflow for Motion operations.'
            exit 1
          fi
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - name: Download the candidate produced by this run
        if: ${{ needs.candidate.result == 'success' }}
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Verify candidate identity and immutable artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          MOTION_EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
          MOTION_CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          MOTION_CANDIDATE_ATTEMPT: ${{ needs.candidate.outputs.attempt }}
          MOTION_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          MOTION_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .github/scripts/motion-release.mjs download "$RUNNER_TEMP/candidate"
      - name: Recheck the integrated source and archives of a retained candidate
        if: ${{ needs.candidate.result == 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MOTION_EXPECTED_SHA256: ${{ steps.download.outputs.tgz_sha256 }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          node .github/scripts/motion-scan.mjs install "$RUNNER_TEMP/scanner"
          node .github/scripts/motion-release.mjs rescan "$RUNNER_TEMP/candidate" "$PWD" "$RUNNER_TEMP/scanner/gitleaks"
      - uses: actions/upload-artifact@v7.0.2
        id: artifact
        with:
          name: verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 30
          if-no-files-found: error

  prepare-templates:
    if: ${{ always() && !cancelled() && !inputs.archive_only && needs.verify.result == 'success' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Validate the frozen template and Skill snapshot
        if: ${{ inputs.mode == 'prepublish' }}
        run: node .github/scripts/publish-template-catalog.mjs validate "$MOTION_VERSION" "$RUNNER_TEMP/candidate"
      - name: Prepare immutable template resources for publication
        if: ${{ inputs.mode == 'publish' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: node .github/scripts/publish-template-catalog.mjs stage "$MOTION_VERSION" "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v7.0.2
        id: artifact
        if: ${{ inputs.mode == 'publish' }}
        with:
          name: template-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/template-preparation.json
          retention-days: 30
          if-no-files-found: error

  npm:
    if: ${{ always() && !cancelled() && (inputs.archive_only || inputs.mode == 'publish') && needs.verify.result == 'success' && (inputs.archive_only || needs.prepare-templates.result == 'success' && needs.registry-mac.result == 'success' && needs.registry-windows.result == 'success') }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
    needs: [verify, registry-mac, registry-windows, prepare-templates]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Use the pinned npm CLI with trusted dist-tag support
        run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        if: ${{ !inputs.archive_only }}
        with:
          artifact-ids: ${{ needs.registry-mac.outputs.artifact_id }},${{ needs.registry-windows.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Record manual publication operator
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/motion-release.mjs authorize "$RUNNER_TEMP/candidate"
      - name: Publish the candidate bytes with npm trusted publishing, or verify an identical existing version
        run: node .github/scripts/motion-release.mjs npm "$RUNNER_TEMP/candidate"
      - name: Retain npm publication state even after a partial failure
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/npm-publication.json
            ${{ runner.temp }}/candidate/authorization.json
          retention-days: 30
          if-no-files-found: warn

  registry-mac:
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && (!inputs.archive_only || inputs.channel == 'stable') }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Exact-version cold installation and native MCP discovery
        shell: bash
        run: |
          node .github/scripts/motion-release.mjs verify "$RUNNER_TEMP/candidate"
          if [ "$MOTION_RELEASE_ACTION" = "archive-only" ]; then
            node .github/scripts/motion-registry-smoke.mjs "$RUNNER_TEMP/candidate"
          else
            node .github/scripts/motion-registry-smoke.mjs "$RUNNER_TEMP/candidate" --candidate
          fi
      - name: Report native installation failure
        if: failure()
        shell: bash
        run: |
          echo '::error::Native installation failed. Inspect the platform report before continuing.'
      - uses: actions/upload-artifact@v7.0.2
        id: artifact
        if: always()
        with:
          name: registry-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/registry-darwin-arm64.json
            ${{ runner.temp }}/candidate/template-runtime-darwin-arm64/
          retention-days: 30
          if-no-files-found: warn

  registry-windows:
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && (!inputs.archive_only || inputs.channel == 'stable') }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Exact-version cold installation and native MCP discovery
        shell: bash
        run: |
          node .github/scripts/motion-release.mjs verify "$RUNNER_TEMP/candidate"
          if [ "$MOTION_RELEASE_ACTION" = "archive-only" ]; then
            node .github/scripts/motion-registry-smoke.mjs "$RUNNER_TEMP/candidate"
          else
            node .github/scripts/motion-registry-smoke.mjs "$RUNNER_TEMP/candidate" --candidate
          fi
      - name: Report native installation failure
        if: failure()
        shell: bash
        run: |
          echo '::error::Native installation failed. Inspect the platform report before continuing.'
      - uses: actions/upload-artifact@v7.0.2
        id: artifact
        if: always()
        with:
          name: registry-win32-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/registry-win32-x64.json
            ${{ runner.temp }}/candidate/template-runtime-win32-x64/
          retention-days: 30
          if-no-files-found: warn

  registry-readback:
    if: ${{ always() && !cancelled() && !inputs.archive_only && needs.verify.result == 'success' && needs.npm.result == 'success' }}
    needs: [verify, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the public npm package before changing its channel
        run: node .github/scripts/motion-release.mjs registry-readback "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/registry-package.json
          retention-days: 30
          if-no-files-found: error

  promote-test:
    if: ${{ inputs.channel != 'stable' && always() && !cancelled() && needs.verify.result == 'success' && needs.npm.result == 'success' && (inputs.archive_only || needs.registry-readback.result == 'success') }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
    needs: [verify, npm, registry-readback]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          registry-url: 'https://registry.npmjs.org'
      - name: Use the pinned npm CLI with trusted dist-tag support
        run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.npm.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Advance npm test with registry propagation retries
        run: node .github/scripts/motion-release.mjs promote-test "$RUNNER_TEMP/candidate"
      - name: Retain the verified channel result
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/test-promotion.json
          retention-days: 30
          if-no-files-found: warn

  snapshot:
    if: ${{ inputs.channel != 'stable' && always() && !cancelled() && needs.verify.result == 'success' && needs.npm.result == 'success' && needs.promote-test.result == 'success' }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
      MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
    needs: [verify, npm, promote-test, prepare-templates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.record.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.npm.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.promote-test.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        if: ${{ !inputs.archive_only }}
        with:
          artifact-ids: ${{ needs.prepare-templates.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Archive exact-version snapshots, verify canonical public bytes, then promote the default guide last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: node .github/scripts/motion-release.mjs archive "$RUNNER_TEMP/candidate"
      - name: Publish template sources and advance the shared release catalog when promoted
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: node .github/scripts/publish-template-catalog.mjs release "$MOTION_VERSION" "$RUNNER_TEMP/candidate"
      - name: Publish the frozen DSH plugin and advance only its verified release channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
        run: node integrations/dsh/release.ts publish "$RUNNER_TEMP/candidate"
      - name: Retain the attempt, immutable release identity and previous default guide
        id: record
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/release-record.json
            ${{ runner.temp }}/candidate/release-attempt.json
            ${{ runner.temp }}/candidate/publication.json
            ${{ runner.temp }}/candidate/dsh-publication.json
            ${{ runner.temp }}/candidate/previous-install.md
          retention-days: 30
          if-no-files-found: warn
      - name: Show the exact-version result and default guide status
        if: success()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const c = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate/candidate.json'));
          const a = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate/release-attempt.json'));
          const origin = process.env.MOTION_INSTALL_PUBLIC_ORIGIN;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Test publication result\n\nVersion: ${c.version}\n\nSource: ${c.sourceCommit}\n\nResult: ${a.stage}\n\n[Exact-version installation guide](${origin}/open-motion/dev/${c.version}/install.md)\n\n[Default test guide](${origin}/open-motion/dev/install.md)\n\nThe default is advanced after registry and public readback; native cold-install checks run afterward; a superseded candidate keeps its version snapshot without moving the default. No stable release occurred.\n`);
          JS

  promote-stable:
    if: ${{ inputs.channel == 'stable' && always() && !cancelled() && needs.verify.result == 'success' && needs.npm.result == 'success' && needs.registry-mac.result == 'success' && needs.registry-windows.result == 'success' && (inputs.archive_only || needs.registry-readback.result == 'success') }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
    needs: [verify, npm, registry-mac, registry-windows, registry-readback]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          registry-url: 'https://registry.npmjs.org'
      - name: Use the pinned npm CLI with trusted dist-tag support
        run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.npm.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.registry-mac.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.registry-windows.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Advance npm latest after both exact prod installations pass
        run: node .github/scripts/motion-release.mjs promote-stable "$RUNNER_TEMP/candidate"
      - name: Retain the verified channel result
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stable-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/stable-promotion.json
          retention-days: 30
          if-no-files-found: warn

  stable-snapshot:
    if: ${{ inputs.channel == 'stable' && always() && !cancelled() && needs.verify.result == 'success' && needs.npm.result == 'success' && needs.promote-stable.result == 'success' }}
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
      MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
    needs: [verify, npm, promote-stable, registry-mac, registry-windows, prepare-templates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.record.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.npm.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.promote-stable.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        if: ${{ !inputs.archive_only }}
        with:
          artifact-ids: ${{ needs.prepare-templates.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.registry-mac.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.registry-windows.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Archive exact-version snapshots, verify canonical public bytes, then promote the default guide last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: node .github/scripts/motion-release.mjs archive "$RUNNER_TEMP/candidate"
      - name: Publish template sources and advance the shared release catalog when promoted
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: node .github/scripts/publish-template-catalog.mjs release "$MOTION_VERSION" "$RUNNER_TEMP/candidate"
      - name: Publish the frozen DSH plugin and advance only its verified release channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
        run: node integrations/dsh/release.ts publish "$RUNNER_TEMP/candidate"
      - name: Retain the attempt, immutable release identity and previous default guide
        id: record
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/release-record.json
            ${{ runner.temp }}/candidate/release-attempt.json
            ${{ runner.temp }}/candidate/publication.json
            ${{ runner.temp }}/candidate/dsh-publication.json
            ${{ runner.temp }}/candidate/previous-install.md
          retention-days: 30
          if-no-files-found: warn
      - name: Show the exact-version result and default guide status
        if: success()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const c = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate/candidate.json'));
          const a = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate/release-attempt.json'));
          const origin = process.env.MOTION_INSTALL_PUBLIC_ORIGIN;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Stable publication result\n\nVersion: ${c.version}\n\nSource: ${c.sourceCommit}\n\nResult: ${a.stage}\n\n[Exact-version installation guide](${origin}/open-motion/${c.version}/install.md)\n\n[Default stable guide](${origin}/open-motion/install.md)\n\nThe stable default follows verified latest and both prod native checks; a superseded candidate keeps its version snapshot without moving the default. The test channel is not changed by stable publication.\n`);
          JS

  release-notes:
    name: Publish GitHub Release notes
    if: ${{ always() && !cancelled() && inputs.archive_only != true && needs.verify.result == 'success' && (needs.snapshot.result == 'success' || needs.stable-snapshot.result == 'success') }}
    needs: [verify, snapshot, stable-snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Notes can be retried without rolling back an already delivered npm version.
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    env:
      MOTION_EXPECTED_SHA256: ${{ needs.verify.outputs.tgz_sha256 }}
      MOTION_VERSION: ${{ needs.verify.outputs.version }}
      MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.snapshot.outputs.artifact_id || needs.stable-snapshot.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Create the exact-source draft and publish its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/motion-release-notes.mjs "$RUNNER_TEMP/candidate"
      - name: Report a release-note failure separately from package delivery
        if: failure()
        run: echo '::warning::npm and installation guides were delivered; GitHub Release notes failed. Inspect this job and rerun the publication with the same exact version to finish notes without republishing different bytes.'
      - name: Retain generated notes and release identity
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: github-release-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/release-notes.md
            ${{ runner.temp }}/candidate/github-release-notes.md
            ${{ runner.temp }}/candidate/github-release.json
          retention-days: 30
          if-no-files-found: warn
